name: validar

on:
  schedule:
    - cron: '0 5 * * 0'   # domingo 5h UTC — re-check semanal
  workflow_dispatch:
    inputs:
      only_unknown:
        description: 'Só os sem status'
        default: 'true'

jobs:
  valida-a:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: deps
        run: |
          pip install -r requirements-scraper.txt
          playwright install chromium
          playwright install-deps chromium
      - name: .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
      - name: valida shard 0
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python validar_supa.py --workers 8 --shard 0 --of 2 --recheck-alive-days 30
          else
            python validar_supa.py --workers 8 --shard 0 --of 2 --only-unknown
          fi
      - name: limpa
        if: always()
        run: rm -f .env

  valida-b:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: deps
        run: |
          pip install -r requirements-scraper.txt
          playwright install chromium
          playwright install-deps chromium
      - name: .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
      - name: valida shard 1
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python validar_supa.py --workers 8 --shard 1 --of 2 --recheck-alive-days 30
          else
            python validar_supa.py --workers 8 --shard 1 --of 2 --only-unknown
          fi
      - name: limpa
        if: always()
        run: rm -f .env
