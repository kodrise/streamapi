name: full-scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: instala deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: decodifica chave
        run: echo "${{ secrets.FIREBASE_KEY }}" | base64 -d > serviceAccountKey.json

      - name: full scan
        run: |
          python scrape.py "https://goyabu.io/lista-de-animes" \
            -o out.json \
            --mode full \
            --pages-limit 0 \
            --firebase-key serviceAccountKey.json \
            --batch 100

      - name: limpa chave
        if: always()
        run: rm -f serviceAccountKey.json
