name: update-catalog

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: instala deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: decodifica chave do firebase
        run: echo "${{ secrets.FIREBASE_KEY }}" | base64 -d > serviceAccountKey.json

      - name: roda scrape
        run: |
          python scrape.py "https://goyabu.io/lista-de-animes" \
            -o catalogo.json \
            --firebase-key serviceAccountKey.json \
            --pages-limit 3 \
            --batch 100

      - name: limpa chave
        if: always()
        run: rm -f serviceAccountKey.json
