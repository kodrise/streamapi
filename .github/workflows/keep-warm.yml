name: keep-warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping api
        run: |
          curl -sf "https://streamapi-peach.vercel.app/api/health" > /dev/null
          echo "[+] api acordada: $(date -u +%FT%TZ)"
